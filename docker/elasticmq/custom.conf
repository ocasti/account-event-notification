# ElasticMQ configuration for the local stack (mounted at /opt/elasticmq.conf).
# Queues are declared here so the worker and the simulator never need to create them.
include classpath("application.conf")

node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

generate-node-address = false

aws {
  region = us-east-1
  accountId = 000000000000
}

queues {
  # Dead-letter queue: messages that failed to be registered 5 times end up here.
  account-events-dlq {
    defaultVisibilityTimeout = 30 seconds
    delay = 0 seconds
    receiveMessageWait = 0 seconds
    fifo = false
  }

  # Main queue consumed by notifications-worker (long polling, 20 s).
  account-events {
    defaultVisibilityTimeout = 30 seconds
    delay = 0 seconds
    receiveMessageWait = 20 seconds
    fifo = false
    deadLettersQueue {
      name = "account-events-dlq"
      maxReceiveCount = 5
    }
  }
}
