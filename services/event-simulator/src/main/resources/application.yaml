server:
  port: ${SERVER_PORT:8080}

spring:
  cloud:
    aws:
      sqs:
        endpoint: ${SQS_ENDPOINT:http://localhost:9324}
      region:
        static: ${SQS_REGION:us-east-1}
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:local}
        secret-key: ${AWS_SECRET_ACCESS_KEY:local}

simulator:
  queue-name: ${SQS_QUEUE_NAME:account-events}
  events-file: ${SIMULATOR_EVENTS_FILE:classpath:notification_events.json}
  emit-interval: ${SIMULATOR_EMIT_INTERVAL:2s}
  emit-reference-on-start: ${SIMULATOR_EMIT_REFERENCE_ON_START:true}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
