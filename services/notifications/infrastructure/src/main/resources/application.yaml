spring:
  application:
    name: notifications
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/notifications}
    username: ${POSTGRES_USER:notifications}
    password: ${POSTGRES_PASSWORD:notifications}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: false
  cloud:
    aws:
      sqs:
        endpoint: ${SQS_ENDPOINT:http://localhost:9324}
      region:
        static: ${SQS_REGION:us-east-1}
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:local}
        secret-key: ${AWS_SECRET_ACCESS_KEY:local}

notifications:
  sqs:
    queue-name: ${SQS_QUEUE_NAME:account-events}
  worker:
    worker-id: ${HOSTNAME:worker-local}
    batch-size: 50
    max-per-client: 10
    lease: 16s
    poll-interval: 1s
    gauge-interval: 5s
  retry:
    base-delay: 30s
    factor: 4
    max-delay: 15m
    jitter-ratio: 0.2
    max-attempts: 5
  webhook:
    connect-timeout: 3s
    read-timeout: 5s
    require-https: true
    allowlist: []
    timestamp-tolerance: 5m
  jwt:
    public-key: file:${JWT_PUBLIC_KEY_PATH:/keys/jwt-public.pem}
    audience: ${JWT_AUDIENCE:account-event-notification}
    client-claim: ${JWT_CLIENT_CLAIM:sub}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        "notifications.webhook.latency": true

logging:
  pattern:
    # Plain text with the SLF4J key-value pairs after the message, so the per-attempt line stays useful
    # without the json profile (which switches the console to ECS).
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p --- [%15.15t] %-40.40logger{39} : %m %kvp%n%wEx"
