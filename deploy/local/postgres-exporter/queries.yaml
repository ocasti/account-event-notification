# Business queries for prometheus-community/postgres_exporter (v0.20.1), mounted via
# PG_EXPORTER_EXTEND_QUERY_PATH (see compose.yaml, postgres-exporter service).
#
# The classic "queries.yaml" format is marked DEPRECATED in the binary (still works in
# v0.20.1; the exporter only warns about it via log on startup). It was chosen over the newer
# custom-collector mechanism (--collector.<name>.query-file) because it produces predictable
# metric names with a single syntax, and the project does not yet publish a stable replacement
# guide for queries.yaml in 0.20.x.
#
# The final name of each metric is "<top-level key>_<column key>" (verified by running the
# exporter against this stack's Postgres): that's why the keys below are deliberately split so
# that the concatenation gives exactly the requested name, e.g.
# "cobre_attempts" + "_due" = cobre_attempts_due.

cobre_events:
  query: "SELECT status, count(*)::float AS by_status FROM notification_events GROUP BY status"
  metrics:
    - status:
        usage: "LABEL"
        description: "Event status (notification_events.status)"
    - by_status:
        usage: "GAUGE"
        description: "Count of notification_events grouped by status"

cobre_attempts:
  query: "SELECT count(*)::float AS due FROM delivery_attempts WHERE executed_at IS NULL AND next_attempt_at <= now()"
  metrics:
    - due:
        usage: "GAUGE"
        description: "Due delivery attempts (next_attempt_at <= now()) that no worker has executed yet"

cobre_attempts_claimed:
  query: "SELECT count(*)::float AS unfinished FROM delivery_attempts WHERE claimed_at IS NOT NULL AND executed_at IS NULL"
  metrics:
    - unfinished:
        usage: "GAUGE"
        description: "Delivery attempts claimed by a worker (claimed_at) that haven't finished yet (executed_at null); if this grows steadily, a worker died holding the lease"

cobre_attempts_executed:
  query: "SELECT count(*)::float AS total FROM delivery_attempts WHERE executed_at IS NOT NULL"
  metrics:
    - total:
        usage: "GAUGE"
        description: "Cumulative total of delivery attempts already executed; a business counter exposed as a gauge because the query recomputes the total on every scrape"

cobre_oldest_pending_age:
  query: "SELECT COALESCE(extract(epoch FROM now() - min(next_attempt_at)), 0)::float AS seconds FROM delivery_attempts WHERE executed_at IS NULL AND next_attempt_at <= now()"
  metrics:
    - seconds:
        usage: "GAUGE"
        description: "Age in seconds of the oldest due, unexecuted attempt; 0 if none is pending"
