# Alerting rules for the local stack, one per alarm in section 16 ("Observabilidad") of
# docs/01-system-design.html. Loaded by prometheus.yml via `rule_files`.
#
# Status of each rule against the metrics actually exposed by /actuator/prometheus today
# (verified 2026-09-15 against a running `make up-all` stack):
#   notifications_attempts_due            -> emitted (DueAttemptsGaugeUpdater). Rules 1 and 3: LIVE.
#   notifications_deliveries_total        -> NEVER emitted: DeliveryMetrics.delivered(...) is only
#                                             called from the unit test (DeliveryMetricsTest), never
#                                             from ProcessDueDeliveries.process(). Rules 2 and 4b will
#                                             load but never fire until that wiring is added (Java
#                                             change, out of this agent's write area: deploy/local/**).
#   notifications_leases_expired_total    -> same gap: DeliveryMetrics.leaseExpired() has no caller
#                                             outside the test. Rule 5: BLOCKED for the same reason.
#   DLQ depth (account-events-dlq)        -> no Prometheus metric exists yet for ElasticMQ's DLQ, and
#                                             none is added here (ElasticMQ exposes no Prometheus
#                                             endpoint; see deploy/local/README.md, "Qué no está
#                                             instrumentado"). The old NotificationsDlqNotEmpty rule
#                                             that referenced the placeholder gauge
#                                             notifications_dlq_messages_visible was DROPPED on
#                                             2026-09-16 instead of kept inert: a rule that can never
#                                             fire is worse than no rule, because it looks covered in
#                                             the alert list. See README, section "Alarmas", for the
#                                             decision and what would need to exist (app-side gauge or
#                                             a dedicated exporter) to bring it back.
#
# 2026-09-16: added NotificationsErrorLogRateHigh, NotificationsApiServerErrors,
# NotificationsDbPoolExhausted, PostgresDown and NotificationsOldestPendingTooOld (the last two
# depend on the postgres-exporter job in prometheus.yml, deploy/local/postgres-exporter/queries.yaml
# for the cobre_* gauges, and pg_up for PostgresDown). NotificationsApiServerErrors depends on the
# HTTP percentile buckets enabled in application.yaml (management.metrics.distribution
# .percentiles-histogram."http.server.requests") only insofar as it needs the *_count series, which
# was already emitted before that change; it does not use histogram_quantile.
#
# 2026-09-16 (segunda tanda, junto con la fila "Carga de Postgres"): añadida PostgresBusyBackendsAboveCores (antes PostgresActiveTimeHigh con umbral 0,8, incorrecto: la métrica suma sesiones y supera 1 con carga normal)
# (job postgres, ya cargado con datos reales).
#
# 2026-09-16 (tercera tanda, tras descartar cAdvisor): se probó cAdvisor para métricas por
# contenedor y se abandonó por dos motivos independientes verificados en este host bajo OrbStack:
# (1) ningún contenedor puede alcanzar el socket de Docker aquí (root o privilegiado, montando
# /var/run entero: "permission denied"), lo que también habría bloqueado a Telegraf
# (inputs.docker); (2) además, el storage driver de este daemon usa el snapshotter de containerd
# (io.containerd.snapshotter.v1), que cAdvisor v0.52.1 no sabe leer para resolver el layer de un
# contenedor. Se reemplazó por node_exporter (métricas de la VM completa, sin depender del socket
# de Docker ni del storage driver) y ContainerMemoryNearLimit por HostMemoryLow y
# HostCpuSaturated (job node). Ver deploy/local/compose.yaml y deploy/local/README.md, sección
# "node_exporter".
groups:
  - name: notifications.rules
    rules:
      # 1. "Intentos vencidos por encima de 30 segundos de trabajo del worker durante 5 minutos".
      #    Each worker claims batches of 50 attempts per 1 s tick (paralelismo HTTP fijado en 50,
      #    section 9/16 of the RFC). 30 s of a single worker's claim capacity is used here as the
      #    threshold: 50 attempts/tick * 30 ticks = 1500. notifications_attempts_due is a gauge
      #    published by every worker replica and aggregated with max (never summed).
      - alert: NotificationsAttemptsDueBacklog
        expr: max(notifications_attempts_due) > 1500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Backlog of due delivery attempts sustained for 5 minutes ({{ $value }} due)"
          runbook: "Escalar réplicas de notifications-worker o revisar la salud/carga de Postgres."

      # 2. "Tasa de fallo de un cliente por encima del 20% con al menos 50 entregas en 10 minutos".
      #    BLOCKED today: see header (notifications_deliveries_total is never populated).
      - alert: NotificationsClientFailureRateHigh
        expr: |
          (
            sum by (client_id) (increase(notifications_deliveries_total{status="failed"}[10m]))
            /
            sum by (client_id) (increase(notifications_deliveries_total[10m]))
          ) > 0.20
          and
          sum by (client_id) (increase(notifications_deliveries_total[10m])) >= 50
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Client {{ $labels.client_id }} has a >20% webhook failure rate over 10 minutes"
          runbook: "Avisar al cliente {{ $labels.client_id }}: su endpoint webhook está degradado."

      # 3. "Métrica de intentos vencidos ausente durante 2 minutos".
      - alert: NotificationsAttemptsDueMetricMissing
        expr: absent(notifications_attempts_due) == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "notifications_attempts_due has not been scraped for 2 minutes"
          runbook: "No queda ningún worker vivo; reiniciar notifications-worker."

      # 5. "Arrendamientos vencidos por encima de 10 por minuto". BLOCKED today: see header
      #    (notifications_leases_expired_total is never populated).
      - alert: NotificationsLeaseExpirationsHigh
        expr: increase(notifications_leases_expired_total[1m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 10 lease expirations per minute, sustained for 5 minutes"
          runbook: "Los POST duran más que el arrendamiento; revisar timeouts del webhook."

      # 6. Tasa sostenida de logs de nivel error en cualquier instancia (api o worker).
      - alert: NotificationsErrorLogRateHigh
        expr: sum by (job) (rate(logback_events_total{level="error"}[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} está logueando más de 0.5 errores/s durante 5 minutos ({{ $value | printf \"%.2f\" }}/s)"
          runbook: "Revisar los logs del job {{ $labels.job }} (docker compose logs) para identificar la causa; si es un solo cliente, ver el panel Errores del tablero."

      # 7. Más del 1% de las respuestas HTTP de la API son 5xx durante 5 minutos.
      - alert: NotificationsApiServerErrors
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{job="notifications-api",status=~"5.."}[5m]))
            /
            sum(rate(http_server_requests_seconds_count{job="notifications-api"}[5m]))
          ) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Más del 1% de las peticiones a notifications-api devuelven 5xx ({{ $value | humanizePercentage }})"
          runbook: "Revisar el panel API HTTP (RPS por uri/status) y los logs de notifications-api; si coincide con HikariCP agotado, ver NotificationsDbPoolExhausted."

      # 8. El pool de conexiones de HikariCP tiene peticiones esperando conexión de forma sostenida.
      - alert: NotificationsDbPoolExhausted
        expr: hikaricp_connections_pending > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} ({{ $labels.instance }}) tiene {{ $value }} conexión(es) esperando el pool de HikariCP desde hace 2 minutos"
          runbook: "Revisar el panel Base de datos (HikariCP activas/idle/max) y pg_stat_activity; considerar subir hikari.maximum-pool-size o investigar consultas lentas."

      # 9. Postgres no responde al postgres-exporter.
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "postgres-exporter no puede conectarse a Postgres desde hace 1 minuto"
          runbook: "Revisar el contenedor postgres (docker compose ps/logs); sin Postgres, la API y el worker no pueden registrar ni entregar eventos."

      # 10. El intento vencido más viejo lleva más de 2 minutos esperando ejecución (dato de Postgres,
      #     independiente del gauge en memoria notifications_attempts_due).
      - alert: NotificationsOldestPendingTooOld
        expr: cobre_oldest_pending_age_seconds > 120
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "El intento de entrega vencido más antiguo lleva {{ $value | printf \"%.0f\" }}s esperando ejecución"
          runbook: "Igual que NotificationsAttemptsDueBacklog: escalar notifications-worker o revisar la salud/carga de Postgres; esta alarma mira la cola desde la base de datos, no desde el gauge en memoria del worker."

      # 11. La base de datos notifications está activamente ejecutando consultas casi todo el
      #     tiempo (rate del contador acumulado de tiempo activo, sección 16-bis "Carga de
      #     Postgres" del tablero). Con >0.8 sostenido durante 5 minutos, Postgres está saturado.
      - alert: PostgresBusyBackendsAboveCores
        # rate(active_time) = segundos de ejecución de SQL por segundo sumados sobre todas las
        # sesiones = número medio de sesiones ocupadas. Saturación real cuando supera los cores de la VM.
        expr: rate(pg_stat_database_active_time_seconds_total{datname="notifications"}[5m]) > scalar(count(node_cpu_seconds_total{mode="idle"}))
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Postgres (notifications) mantiene {{ $value | printf \"%.1f\" }} sesiones ejecutando SQL en promedio durante 5 minutos, más que los cores de la VM"
          runbook: "La base está saturada de consultas; revisar el panel 'Carga de Postgres' (scans por tabla, tuplas por segundo, backends por estado) y los índices de delivery_attempts, o bajar batch-size / réplicas del worker."

      # 12. La VM de Docker se está quedando sin memoria disponible (node_exporter, fila
      #     "Recursos del entorno (VM de Docker)"). No es por servicio (eso no es observable bajo
      #     OrbStack, ver cabecera de este archivo): es la VM completa.
      - alert: HostMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "La VM de Docker solo tiene el {{ $value | humanizePercentage }} de memoria disponible durante 5 minutos"
          runbook: "Subir el límite de memoria asignado a la VM de Docker (OrbStack/Docker Desktop) o bajar la carga (menos réplicas de worker, EVENTS más chico en la prueba de carga)."

      # 13. La VM de Docker está saturada de CPU (node_exporter). idle < 10% durante 5 minutos:
      #     casi no queda capacidad de CPU libre.
      - alert: HostCpuSaturated
        expr: sum(rate(node_cpu_seconds_total{mode="idle"}[5m])) / count(node_cpu_seconds_total{mode="idle"}) < 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "La VM de Docker tiene menos del 10% de CPU idle durante 5 minutos ({{ $value | humanizePercentage }} idle)"
          runbook: "Revisar el panel 'CPU total por modo' y 'Load average vs. núcleos'; reducir la carga (menos réplicas, EVENTS más chico) o asignar más CPU a la VM."
