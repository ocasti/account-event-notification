# Alerting rules for the local stack, one per alarm in section 16 ("Observability") of
# docs/01-system-design.html. Loaded by prometheus.yml via `rule_files`.
#
# Status of each rule against the metrics actually exposed by /actuator/prometheus today
# (verified 2026-09-15 against a running `make up-all` stack):
#   notifications_attempts_due            -> emitted (DueAttemptsGaugeUpdater). Rules 1 and 3: LIVE.
#   notifications_deliveries_total        -> NEVER emitted: DeliveryMetrics.delivered(...) is only
#                                             called from the unit test (DeliveryMetricsTest), never
#                                             from ProcessDueDeliveries.process(). Rules 2 and 4b will
#                                             load but never fire until that wiring is added (Java
#                                             change, out of this agent's write area: deploy/local/**).
#   notifications_leases_expired_total    -> same gap: DeliveryMetrics.leaseExpired() has no caller
#                                             outside the test. Rule 5: BLOCKED for the same reason.
#   DLQ depth (account-events-dlq)        -> no Prometheus metric exists yet for ElasticMQ's DLQ, and
#                                             none is added here (ElasticMQ exposes no Prometheus
#                                             endpoint; see deploy/local/README.md, "What isn't
#                                             instrumented"). The old NotificationsDlqNotEmpty rule
#                                             that referenced the placeholder gauge
#                                             notifications_dlq_messages_visible was DROPPED on
#                                             2026-09-16 instead of kept inert: a rule that can never
#                                             fire is worse than no rule, because it looks covered in
#                                             the alert list. See README, section "Alerts", for the
#                                             decision and what would need to exist (app-side gauge or
#                                             a dedicated exporter) to bring it back.
#
# 2026-09-16: added NotificationsErrorLogRateHigh, NotificationsApiServerErrors,
# NotificationsDbPoolExhausted, PostgresDown and NotificationsOldestPendingTooOld (the last two
# depend on the postgres-exporter job in prometheus.yml, deploy/local/postgres-exporter/queries.yaml
# for the cobre_* gauges, and pg_up for PostgresDown). NotificationsApiServerErrors depends on the
# HTTP percentile buckets enabled in application.yaml (management.metrics.distribution
# .percentiles-histogram."http.server.requests") only insofar as it needs the *_count series, which
# was already emitted before that change; it does not use histogram_quantile.
#
# 2026-09-16 (second batch, together with the "Postgres load" row): added
# PostgresBusyBackendsAboveCores (previously PostgresActiveTimeHigh with threshold 0.8, incorrect:
# the metric sums sessions and exceeds 1 under normal load)
# (job postgres, already loaded with real data).
#
# 2026-09-16 (third batch, after ruling out cAdvisor): cAdvisor was tried for per-container
# metrics and dropped for two independent reasons verified on this host under OrbStack:
# (1) no container can reach the Docker socket here (root or privileged, mounting the whole
# /var/run: "permission denied"), which would also have blocked Telegraf
# (inputs.docker); (2) also, this daemon's storage driver uses the containerd snapshotter
# (io.containerd.snapshotter.v1), which cAdvisor v0.52.1 cannot read to resolve a container's
# layer. It was replaced with node_exporter (metrics for the whole VM, without depending on the
# Docker socket or the storage driver) and ContainerMemoryNearLimit with HostMemoryLow and
# HostCpuSaturated (job node). See deploy/local/compose.yaml and deploy/local/README.md, section
# "node_exporter".
groups:
  - name: notifications.rules
    rules:
      # 1. "Due attempts above 30 seconds of worker processing capacity over 5 minutes".
      #    Each worker claims batches of 50 attempts per 1 s tick (HTTP parallelism fixed at 50,
      #    section 9/16 of the RFC). 30 s of a single worker's claim capacity is used here as the
      #    threshold: 50 attempts/tick * 30 ticks = 1500. notifications_attempts_due is a gauge
      #    published by every worker replica and aggregated with max (never summed).
      - alert: NotificationsAttemptsDueBacklog
        expr: max(notifications_attempts_due) > 1500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Backlog of due delivery attempts sustained for 5 minutes ({{ $value }} due)"
          runbook: "Scale up notifications-worker replicas or check Postgres health/load."

      # 2. "A client's failure rate above 20% with at least 50 deliveries over 10 minutes".
      #    BLOCKED today: see header (notifications_deliveries_total is never populated).
      - alert: NotificationsClientFailureRateHigh
        expr: |
          (
            sum by (client_id) (increase(notifications_deliveries_total{status="failed"}[10m]))
            /
            sum by (client_id) (increase(notifications_deliveries_total[10m]))
          ) > 0.20
          and
          sum by (client_id) (increase(notifications_deliveries_total[10m])) >= 50
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Client {{ $labels.client_id }} has a >20% webhook failure rate over 10 minutes"
          runbook: "Notify client {{ $labels.client_id }}: their webhook endpoint is degraded."

      # 3. "Due-attempts metric missing for 2 minutes".
      - alert: NotificationsAttemptsDueMetricMissing
        expr: absent(notifications_attempts_due) == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "notifications_attempts_due has not been scraped for 2 minutes"
          runbook: "No worker is alive anymore; restart notifications-worker."

      # 5. "Lease expirations above 10 per minute". BLOCKED today: see header
      #    (notifications_leases_expired_total is never populated).
      - alert: NotificationsLeaseExpirationsHigh
        expr: increase(notifications_leases_expired_total[1m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 10 lease expirations per minute, sustained for 5 minutes"
          runbook: "POST requests take longer than the lease; check webhook timeouts."

      # 6. Sustained rate of error-level logs on any instance (api or worker).
      - alert: NotificationsErrorLogRateHigh
        expr: sum by (job) (rate(logback_events_total{level="error"}[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} is logging more than 0.5 errors/s over 5 minutes ({{ $value | printf \"%.2f\" }}/s)"
          runbook: "Check the logs for job {{ $labels.job }} (docker compose logs) to identify the cause; if it's a single client, see the Errors panel on the dashboard."

      # 7. More than 1% of the API's HTTP responses are 5xx over 5 minutes.
      - alert: NotificationsApiServerErrors
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{job="notifications-api",status=~"5.."}[5m]))
            /
            sum(rate(http_server_requests_seconds_count{job="notifications-api"}[5m]))
          ) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "More than 1% of requests to notifications-api return 5xx ({{ $value | humanizePercentage }})"
          runbook: "Check the HTTP API panel (RPS by uri/status) and the notifications-api logs; if it coincides with HikariCP exhaustion, see NotificationsDbPoolExhausted."

      # 8. The HikariCP connection pool has requests waiting for a connection in a sustained way.
      - alert: NotificationsDbPoolExhausted
        expr: hikaricp_connections_pending > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} ({{ $labels.instance }}) has {{ $value }} connection(s) waiting on the HikariCP pool for 2 minutes"
          runbook: "Check the Database panel (HikariCP active/idle/max) and pg_stat_activity; consider raising hikari.maximum-pool-size or investigating slow queries."

      # 9. Postgres is not responding to postgres-exporter.
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "postgres-exporter has been unable to connect to Postgres for 1 minute"
          runbook: "Check the postgres container (docker compose ps/logs); without Postgres, the API and worker cannot record or deliver events."

      # 10. The oldest due attempt has been waiting more than 2 minutes for execution (Postgres
      #     data, independent of the in-memory notifications_attempts_due gauge).
      - alert: NotificationsOldestPendingTooOld
        expr: cobre_oldest_pending_age_seconds > 120
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The oldest due delivery attempt has been waiting {{ $value | printf \"%.0f\" }}s for execution"
          runbook: "Same as NotificationsAttemptsDueBacklog: scale up notifications-worker or check Postgres health/load; this alert looks at the queue from the database, not from the worker's in-memory gauge."

      # 11. The notifications database is actively running queries almost all of the
      #     time (rate of the cumulative active-time counter, section 16-bis "Postgres
      #     load" on the dashboard). With >0.8 sustained over 5 minutes, Postgres is saturated.
      - alert: PostgresBusyBackendsAboveCores
        # rate(active_time) = seconds of SQL execution per second summed across all
        # sessions = average number of busy sessions. Real saturation when it exceeds the VM's cores.
        expr: rate(pg_stat_database_active_time_seconds_total{datname="notifications"}[5m]) > scalar(count(node_cpu_seconds_total{mode="idle"}))
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Postgres (notifications) holds {{ $value | printf \"%.1f\" }} sessions running SQL on average over 5 minutes, more than the VM's cores"
          runbook: "The database is saturated with queries; check the 'Postgres load' panel (scans per table, tuples per second, backends by state) and the delivery_attempts indexes, or lower the batch-size / worker replicas."

      # 12. The Docker VM is running low on available memory (node_exporter, row
      #     "Environment resources (Docker VM)"). It is not per service (that isn't observable
      #     under OrbStack, see the header of this file): it is the whole VM.
      - alert: HostMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The Docker VM only has {{ $value | humanizePercentage }} of memory available over 5 minutes"
          runbook: "Raise the memory limit assigned to the Docker VM (OrbStack/Docker Desktop) or lower the load (fewer worker replicas, smaller EVENTS in the load test)."

      # 13. The Docker VM is CPU-saturated (node_exporter). idle < 10% over 5 minutes:
      #     almost no free CPU capacity is left.
      - alert: HostCpuSaturated
        expr: sum(rate(node_cpu_seconds_total{mode="idle"}[5m])) / count(node_cpu_seconds_total{mode="idle"}) < 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The Docker VM has less than 10% CPU idle over 5 minutes ({{ $value | humanizePercentage }} idle)"
          runbook: "Check the 'Total CPU by mode' and 'Load average vs. cores' panels; reduce the load (fewer replicas, smaller EVENTS) or allocate more CPU to the VM."
