# Prometheus scrape configuration for the local stack.
# Both roles expose Micrometer metrics on /actuator/prometheus (port 8080).
global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

scrape_configs:
  - job_name: notifications-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notifications-api:8080"]
        labels:
          role: api

  # The worker publishes no ports and can be scaled (--scale notifications-worker=N).
  # Compose's embedded DNS returns one A record per replica for the service name,
  # so every replica is scraped and gets its own `instance` label (container IP).
  - job_name: notifications-worker
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ["notifications-worker"]
        type: A
        port: 8080
        refresh_interval: 5s
    relabel_configs:
      - target_label: role
        replacement: worker
