# Prometheus scrape configuration for the local stack.
# Both roles expose Micrometer metrics on /actuator/prometheus (port 8080).
global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: notifications-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notifications-api:8080"]
        labels:
          role: api

  # The worker publishes no ports and can be scaled (--scale notifications-worker=N).
  # Compose's embedded DNS returns one A record per replica for the service name,
  # so every replica is scraped and gets its own `instance` label (container IP).
  - job_name: notifications-worker
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ["notifications-worker"]
        type: A
        port: 8080
        refresh_interval: 5s
    relabel_configs:
      - target_label: role
        replacement: worker

  # prometheus-community/postgres_exporter (deploy/local/postgres-exporter), one static target,
  # no ports published on the exporter itself (only reachable inside the notifications network).
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          role: postgres

  # quay.io/prometheus/node-exporter (deploy/local, profile observability), port 9100. Host/VM
  # metrics (CPU, load, memory, disk, network), not per-container: see compose.yaml and
  # deploy/local/README.md ("node_exporter") for why cAdvisor/per-container metrics don't work
  # under this OrbStack VM (no container can reach the Docker socket here).
  - job_name: node
    metrics_path: /metrics
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          role: node
